<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Thai Top 100 History">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>📈 History — Thai Top 100</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; padding-bottom: 40px; }
    
    .header {
      background: #1e293b; border-bottom: 1px solid #334155;
      padding: 12px 18px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .back-btn {
      color: #8b949e; text-decoration: none; font-size: 0.9em; display: flex; align-items: center; gap: 5px;
    }
    .back-btn:hover { color: #fff; }
    .title { font-size: 1.1em; font-weight: 600; color: #fff; }

    .content { max-width: 900px; margin: 0 auto; padding: 18px; }
    
    .stock-info { margin-bottom: 24px; }
    .stock-ticker { font-size: 1.8em; font-weight: bold; color: #fff; }
    .stock-name { color: #8b949e; font-size: 1em; margin-top: 4px; }

    .history-list { display: flex; flex-direction: column; gap: 16px; }
    .history-item {
      background: #1e293b; border: 1px solid #475569; border-radius: 12px;
      overflow: hidden;
    }
    .item-head {
      background: #1c2128; padding: 12px 16px; border-bottom: 1px solid #475569;
      display: flex; justify-content: space-between; align-items: center;
    }
    .item-date { font-weight: 600; color: #fff; }
    .item-price { color: #e6edf3; font-size: 0.95em; }
    .item-pct { font-weight: bold; }
    
    .item-body { padding: 16px; }
    .item-chart { width: 100%; border-radius: 8px; border: 1px solid #475569; margin-bottom: 16px; display: block; }
    
    .item-analysis {
      font-size: 0.95em; line-height: 1.6; color: #d1d5db; white-space: pre-wrap;
      background: #0f172a; padding: 14px; border-radius: 8px; border-left: 3px solid #10b981;
    }
    .analysis-label { color: #10b981; font-weight: bold; font-size: 0.8em; margin-bottom: 6px; text-transform: uppercase; }

    .up { color: #16c784; }
    .down { color: #ea3943; }

    .state-msg { text-align: center; padding: 80px 20px; color: #6b7280; font-size: 1.1em; }
    
    /* ── Market Index specific styles ── */
    .market-indices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .mkt-card { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #475569; }
    .mkt-name { font-size: 0.8em; color: #8b949e; margin-bottom: 4px; }
    .mkt-val { font-weight: bold; color: #fff; }
  </style>
</head>
<body>

<div class="header">
  <a href="index.html" id="backLink" class="back-btn">‹ กลับไปที่ Top 100</a>
  <div class="title" id="pageTitle">Stock History</div>
  <div style="width:70px"></div>
</div>

<div class="content">
  <div id="stockHeader" class="stock-info"></div>
  <div id="historyList" class="history-list">
    <div class="state-msg">กำลังโหลดประวัติ...</div>
  </div>
</div>

<script>
const MONTHS_TH = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function fmtDate(d) {
  const [y,m,day] = d.split('-');
  return `${parseInt(day)} ${MONTHS_TH[parseInt(m)]} ${y}`;
}

async function init() {
  const params = new URLSearchParams(location.search);
  const ticker = params.get('ticker');
  const returnDate = params.get('date');
  
  if (returnDate) {
    document.getElementById('backLink').href = `index.html?date=${returnDate}`;
  }

  if (!ticker) {
    document.getElementById('historyList').innerHTML = '<div class="state-msg">ไม่พบ Ticker ที่ระบุ</div>';
    return;
  }

  document.getElementById('pageTitle').textContent = `History — ${ticker}`;

  try {
    const rIdx = await fetch('../thai-data/index.json?nocache=' + Date.now());
    if (!rIdx.ok) throw new Error('ไม่พบข้อมูลดัชนี');
    const dates = await rIdx.json();
    
    const historyData = [];
    let stockMeta = null;

    // Load data for each date (Parallel)
    const loaders = dates.map(async date => {
      try {
        const r = await fetch(`../thai-data/${date}.json?nocache=` + Date.now());
        if (r.ok) {
          const data = await r.json();
          if (ticker === '_MARKET_THAI') {
            historyData.push({ date, market: data.market_indices, summary: data.summary });
          } else {
            const s = data.stocks?.find(x => x.ticker === ticker);
            if (s) {
              historyData.push({ date, ...s });
              if (!stockMeta) stockMeta = { ticker: s.ticker, name: s.name };
            }
          }
        }
      } catch (e) {}
    });

    await Promise.all(loaders);
    historyData.sort((a,b) => b.date.localeCompare(a.date));

    if (ticker === '_MARKET_THAI') {
      renderMarketHistory(historyData);
    } else if (historyData.length) {
      renderStockHistory(stockMeta, historyData);
    } else {
      document.getElementById('historyList').innerHTML = '<div class="state-msg">ยังไม่มีข้อมูลประวัติสำหรับหุ้นตัวนี้</div>';
    }
  } catch (e) {
    document.getElementById('historyList').innerHTML = `<div class="state-msg">เกิดข้อผิดพลาด: ${e.message}</div>`;
  }
}

function renderStockHistory(meta, list) {
  document.getElementById('stockHeader').innerHTML = `
    <div class="stock-ticker">${meta.ticker.replace('.BK','')}</div>
    <div class="stock-name">${meta.name.replace('.BK','')}</div>
  `;

  document.getElementById('historyList').innerHTML = list.map(item => {
    const up = item.pct_change >= 0;
    const color = up ? 'up' : 'down';
    const arrow = up ? '▲' : '▼';
    
    return `
      <div class="history-item">
        <div class="item-head">
          <div class="item-date">${fmtDate(item.date)}</div>
          <div class="item-price">
            $${item.price.toFixed(2)} 
            <span class="item-pct ${color}">${arrow} ${Math.abs(item.pct_change).toFixed(2)}%</span>
          </div>
        </div>
        <div class="item-body">
          ${item.chart_b64 ? `<img class="item-chart" src="data:image/jpeg;base64,${item.chart_b64}" loading="lazy">` : ''}
          ${item.analysis ? `
            <div class="item-analysis">
              <div class="analysis-label">🇹🇭 AI วิเคราะห์</div>
              ${item.analysis.trim()}
            </div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function renderMarketHistory(list) {
  document.getElementById('stockHeader').innerHTML = `
    <div class="stock-ticker">ภาพรวมตลาดหุ้นไทย</div>
    <div class="stock-name">SET Index / SET50 / SET100</div>
  `;

  document.getElementById('historyList').innerHTML = list.map(item => {
    const m = item.market || {};
    const s = item.summary || {};
    
    const indexHTML = ['set','set50','set100'].filter(k => m[k]).map(k => {
      const d = m[k];
      const up = d.pct_change >= 0;
      const color = up ? 'up' : 'down';
      return `
        <div class="mkt-card">
          <div class="mkt-name">${k.toUpperCase()}</div>
          <div class="mkt-val">${d.price.toLocaleString()} <span class="${color}">${up?'+':''}${d.pct_change.toFixed(2)}%</span></div>
        </div>`;
    }).join('');

    return `
      <div class="history-item">
        <div class="item-head">
          <div class="item-date">${fmtDate(item.date)}</div>
          <div style="font-size:0.85em;color:#8b949e">
            Avg Change: <span class="${s.avg_change>=0?'up':'down'}">${s.avg_change>=0?'+':''}${s.avg_change?.toFixed(2)}%</span>
          </div>
        </div>
        <div class="item-body">
          <div class="market-indices">${indexHTML}</div>
          ${m.set?.chart_b64 ? `<img class="item-chart" src="data:image/jpeg;base64,${m.set.chart_b64}" loading="lazy">` : ''}
        </div>
      </div>
    `;
  }).join('');
}

init();
</script>
</body>
</html>
