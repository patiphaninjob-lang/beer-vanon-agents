<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">

  <title>Beer Top 100 - Stock Thought History</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }

<body>
  <div class="topbar">

        <div class="ticker-title" id="tickerTitle">Loading...</div>

    </div>

      <button data-range="1mo">1M</button>
      <button data-range="6mo">6M</button>

    </div>
  </div>

  <div class="wrap">
    <div class="layout">
      <section class="panel">
        <div class="chart-head">
          <div>
            <div class="chart-title" id="chartTitle">กราฟความคิดของฉัน</div>
            <div class="chart-meta" id="chartMeta">Timeframe: 1D · Default range: 1Y</div>
          </div>

        </div>
        <div class="chart-box">
          <canvas id="priceCanvas"></canvas>
          <div class="hover-tip" id="hoverTip"></div>
          <div class="loading" id="loading">กำลังโหลดกราฟ 1D...</div>
        </div>
        <div class="legend">
          <span><i class="dot"></i> จุดที่เคยบันทึกความคิด/อารมณ์</span>
          <span id="visibleCount">-</span>
        </div>
        <div class="detail" id="detailPanel">
          <div class="detail-empty">กดจุดสีทองบนกราฟ หรือเลือกบันทึกด้านขวา เพื่อดูว่าตอนนั้นคิดอะไรอยู่</div>
        </div>
      </section>

      <aside class="panel">
        <div class="side-title">มุมมองทั้งหมด</div>
        <div class="side-sub" id="noteSummary">กำลังโหลด notes...</div>
        <div class="note-list" id="noteList"></div>

  </div>

  <script>
const NOTES_FILE = 'notes/notes.json';
const MONTHS_TH = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function getEmotionColor(emotion) {
  if (!emotion) return '#f0b90b'; // default gold
  const fear = ['กลัว'];
  const confident = ['มั่นใจแต่ระวัง'];
  const hesitant = ['ลังเล', 'ใจเย็นรอ', 'ไม่เชื่อข่าว'];
  const greed = ['โลภ', 'FOMO'];
  
  if (fear.includes(emotion)) return '#ef5350'; // Red
  if (confident.includes(emotion)) return '#26a69a'; // Green
  if (hesitant.includes(emotion)) return '#facc15'; // Yellow
  if (greed.includes(emotion)) return '#3b82f6'; // Blue
  return '#f0b90b'; // default gold
}

const state = {
  ticker: normalizeTicker(new URLSearchParams(location.search).get('ticker') || 'NVDA'),
  range: new URLSearchParams(location.search).get('range') || '1y',
  notes: [],
  allCandles: [],
  candles: [],
  markers: [],
  archiveCache: {},
  latestStock: null,
  latestMarket: null,
  latestMarketArchive: null,
  latestDate: null,
  selectedKey: null,
  resizeTimer: null,
  hoveredKey: null,
  hoverIntensities: {},
  animating: false
};

const canvas = document.getElementById('priceCanvas');
const ctx = canvas.getContext('2d');
const hoverTip = document.getElementById('hoverTip');

function normalizeTicker(value) {
  return String(value || '').trim().toUpperCase().replace('.', '-');
}
function esc(value) {
  return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(date) {
  if (!date) return '';
  const [y,m,d] = date.split('-');
  return `${parseInt(d,10)} ${MONTHS_TH[parseInt(m,10)]} ${y}`;
}
function fmtMoney(value) {
  if (value == null || Number.isNaN(Number(value))) return '-';
  return '$' + Number(value).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function setLoading(text) {
  const el = document.getElementById('loading');
  el.textContent = text || '';
  el.style.display = text ? 'flex' : 'none';
}
function toast(text) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

async function fetchJson(url) {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(`${url} HTTP ${r.status}`);
  return r.json();
}

function canReturnToDashboard() {
  if (!document.referrer) return false;
  try {
    const ref = new URL(document.referrer);
    const currentDir = location.pathname.replace(/[^/]*$/, '');
    return ref.origin === location.origin
      && ref.pathname.replace(/[^/]*$/, '') === currentDir
      && (ref.pathname === currentDir || ref.pathname === currentDir + 'index.html');
  } catch (e) {
    return false;
  }
}

function bindBackLinkRestore() {
  const backLink = document.getElementById('backLink');
  if (!backLink) return;
  backLink.addEventListener('click', event => {
    if (!canReturnToDashboard()) return;
    event.preventDefault();
    history.back();
  });
}

function noteDate(n) {
  return n.date || n.archive_date || '';
}

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB3ky96m5kIMzwBYOMkPk7YCrMT_ZEzwHc",
  authDomain: "beam-7645f.firebaseapp.com",
  projectId: "beam-7645f",
  storageBucket: "beam-7645f.firebasestorage.app",
  messagingSenderId: "645933254174",
  appId: "1:645933254174:web:75a7e62fda923c9975500f"
};
const FIRESTORE_DOC_PATH = 'data/beer_top100_notes';

let notesDocRef      = null;
let notesSyncReady   = false;
let firestoreListenerRegistered = false;
let globalNotesCache = {};

function hasFirebaseClient() {
  return typeof firebase !== 'undefined' && typeof firebase.initializeApp === 'function' && typeof firebase.firestore === 'function';
}

function initCloudSync() {
  if (notesSyncReady) {
    registerFirestoreRealtimeListener();
    return true;
  }
  if (!hasFirebaseClient()) return false;
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
    const db = firebase.firestore();
    const [collectionName, docName] = FIRESTORE_DOC_PATH.split('/');
    notesDocRef = db.collection(collectionName).doc(docName);
    notesSyncReady = true;
    registerFirestoreRealtimeListener();
    return true;
  } catch (e) {
    console.warn('[cloud-sync] init failed', e);
    notesDocRef = null;
    notesSyncReady = false;
    return false;
  }
}

async function loadNotesFromFirestore() {
  if (!initCloudSync() || !notesDocRef) return false;
  try {
    const snap = await notesDocRef.get();
    if (!snap.exists) return false;
    const data = snap.data() || {};
    const next = cloneNotesMap(data.notes || data.notesCache || {});
    if (!Object.keys(next).length) return false;
    return next;
  } catch (e) {
    console.warn('[cloud-sync] load firestore failed', e);
    return false;
  }
}

function cloneNotesMap(src) {
  const out = {};
  if (!src || typeof src !== 'object') return out;
  for (const [ticker, notes] of Object.entries(src)) {
    if (ticker === '_watchlist') {
      if (Array.isArray(notes)) out[ticker] = [...notes];
      continue;
    }
    if (!Array.isArray(notes)) continue;
    out[ticker] = notes.map(note => ({ ...note }));
  }
  return out;
}

function registerFirestoreRealtimeListener() {
  if (firestoreListenerRegistered || !notesDocRef) return;
  firestoreListenerRegistered = true;
  
  notesDocRef.onSnapshot(snap => {
    if (!snap.exists) return;
    const data = snap.data() || {};
    const next = cloneNotesMap(data.notes || data.notesCache || {});
    
    const oldStr = JSON.stringify(globalNotesCache);
    const newStr = JSON.stringify(next);
    if (oldStr !== newStr) {
      globalNotesCache = next;
      
      const keys = [...new Set([state.ticker, state.ticker.replace('-', '.')])];
      let tickerNotes = [];
      keys.forEach(key => {
        if (globalNotesCache[key]) tickerNotes = tickerNotes.concat(globalNotesCache[key]);
      });
      state.notes = tickerNotes
        .filter(n => n && noteDate(n))
        .sort((a,b) => noteDate(a).localeCompare(noteDate(b)));
        
      drawChart();
      if (typeof renderSidebarList === 'function') {
        renderSidebarList();
      }
      
      if (state.selectedKey) {
        const group = groupNotesByDate(state.notes).find(x => x.date === state.selectedKey);
        if (group) {
          showGroup(group, nearestCandle(state.selectedKey)?.candle);
        }
      }
      
      console.log('[history-cloud] Notes updated in real-time from Firestore.');
    }
  }, e => {
    console.warn('[history-cloud] Real-time listener error:', e);
    firestoreListenerRegistered = false;
  });
}

async function loadNotes() {
  initCloudSync(); // Make sure real-time listener initializes
  const firestoreData = await loadNotesFromFirestore();
  if (firestoreData) {
    globalNotesCache = firestoreData;
    const keys = [...new Set([state.ticker, state.ticker.replace('-', '.')])];
    state.notes = [];
    keys.forEach(key => {
      if (firestoreData[key]) state.notes = state.notes.concat(firestoreData[key]);
    });
  } else {
    try {
      const db = await fetchJson(`${NOTES_FILE}?nocache=${Date.now()}`);
      globalNotesCache = db;
      const keys = [...new Set([state.ticker, state.ticker.replace('-', '.')])];
      state.notes = [];
      keys.forEach(key => {
        if (db[key]) state.notes = state.notes.concat(db[key]);
      });
    } catch (e) {
      state.notes = [];
    }
  }
  state.notes = state.notes
    .filter(n => n && noteDate(n))
    .sort((a,b) => noteDate(a).localeCompare(noteDate(b)));
}

async function loadLatestStock() {
  try {
    const dates = await fetchJson(`data/index.json?nocache=${Date.now()}`);
    // "Latest Always" - we always point the back link to the newest archive
    if (dates.length) document.getElementById('backLink').href = `index.html?date=${encodeURIComponent(dates[0])}`;
    
    // Always look for the very latest data, ignore URL ?date=
    for (const date of dates.slice(0, 20)) {
      const day = await loadArchive(date);
      if (!day) continue;
      
      if (state.ticker.startsWith('_')) {
        if (day.market_indices) {
          state.latestMarketArchive = day;
          state.latestMarket = day.market_indices;
          if (!state.latestDate) state.latestDate = date;
          return;
        }
      } else {
        const stock = findStock(day, state.ticker);
        if (stock) {
          state.latestStock = stock;
          if (!state.latestDate) state.latestDate = date;
          return;
        }
      }
    }
  } catch (e) {
    console.warn('archive lookup failed', e);
  }
}

async function loadArchive(date) {
  if (!date) return null;
  if (!state.archiveCache[date]) {
    state.archiveCache[date] = await fetchJson(`data/${date}.json?nocache=${Date.now()}`);
  }
  return state.archiveCache[date];
}
function findStock(day, ticker) {
  if (!day?.stocks) return null;
  const wanted = normalizeTicker(ticker);
  return day.stocks.find(s => normalizeTicker(s.ticker) === wanted || normalizeTicker(s.ticker).replace('-', '.') === wanted);
}

function parseHistoryCandles(data) {
  return (data?.candles || []).map(row => {
    if (Array.isArray(row)) {
      return { date: row[0], open: row[1], high: row[2], low: row[3], close: row[4], volume: row[5] || 0 };
    }
    return row;
  }).filter(c => c?.date && [c.open,c.high,c.low,c.close].every(v => Number.isFinite(Number(v))))
    .map(c => ({
      date: c.date,
      open: Number(c.open),
      high: Number(c.high),
      low: Number(c.low),
      close: Number(c.close),
      volume: Number(c.volume || 0)
    }))
    .sort((a,b) => a.date.localeCompare(b.date));
}

async function loadHistoryCandles() {
  if (state.allCandles.length) return state.allCandles;
  
  const tryLoad = async (ticker) => {
    try {
      const data = await fetchJson(`history-data/${encodeURIComponent(ticker)}.json?nocache=${Date.now()}`);
      return parseHistoryCandles(data);
    } catch (e) { return null; }
  };

  let candles = [];
  if (state.ticker === '_MARKET') {
    candles = await tryLoad('market');
    if (!candles || !candles.length) candles = await buildArchiveFallbackCandles();
  } else if (state.ticker.startsWith('_')) {
    const key = state.ticker.slice(1).toLowerCase(); // 'dji', 'spx', 'ixic'
    candles = await tryLoad(state.ticker);
    if (!candles || !candles.length) {
      if (key === 'dji') candles = await tryLoad('market'); // legacy fallback
    }
    if (!candles || !candles.length) candles = await buildArchiveFallbackCandles();
  } else {
    candles = await tryLoad(state.ticker);
    if (!candles) candles = await tryLoad(state.ticker.replace('-', '.'));
    if (!candles || !candles.length) candles = await buildArchiveFallbackCandles();
  }
  state.allCandles = candles;

  // STITCHING & PLACEHOLDERS: Guarantee space for every note and latest archive
  const candleDates = new Set(state.allCandles.map(c => c.date));
  const latestDate = state.latestDate || (state.allCandles.length ? state.allCandles[state.allCandles.length-1].date : null);
  
  // 1. Add latest archive candle if missing
  if (latestDate && !candleDates.has(latestDate)) {
      let lp = 0, lv = 0, lo = 0;
      if (state.ticker.startsWith('_') && state.latestMarket) {
        const key = state.ticker === '_MARKET' ? 'dji' : state.ticker.slice(1).toLowerCase();
        const p = state.latestMarket[key];
        lp = Number(p?.price || 0);
        lo = lp / (1 + (Number(p?.pct_change || 0) / 100));
      } else if (state.latestStock) {
        lp = Number(state.latestStock.price || 0);
        lo = lp / (1 + (Number(state.latestStock.pct_change || 0) / 100));
        lv = Number(state.latestStock.volume || 0);
      }
      if (lp > 0) {
        state.allCandles.push({
          date: latestDate, open: lo || lp, high: Math.max(lo, lp) * 1.001, low: Math.min(lo, lp) * 0.999, close: lp, volume: lv, is_stitched: true
        });
        candleDates.add(latestDate);
      }
  }

  // 2. Add placeholder for every note date if missing
  state.notes.forEach(n => {
    const d = noteDate(n);
    if (d && !candleDates.has(d)) {
      const last = state.allCandles.length ? state.allCandles[state.allCandles.length-1] : { close: 100 };
      state.allCandles.push({
        date: d, open: last.close, high: last.close, low: last.close, close: last.close, volume: 0, is_placeholder: true
      });
      candleDates.add(d);
    }
  });

  state.allCandles.sort((a,b) => a.date.localeCompare(b.date));
  return state.allCandles;
}

function filterCandlesByRange(candles, range) {
  if (!candles.length || range === 'max') return candles;
  const last = candles[candles.length - 1].date;
  const start = new Date(last + 'T12:00:00');
  const months = { '1mo': 1, '6mo': 6, '1y': 12, '5y': 60 }[range] || 12;
  start.setMonth(start.getMonth() - months);
  const startKey = start.toISOString().slice(0, 10);
  return candles.filter(c => c.date >= startKey);
}

async function buildArchiveFallbackCandles() {
  const dates = await fetchJson(`data/index.json?nocache=${Date.now()}`);
  const candles = [];
  for (const date of dates.slice(0, 100)) { // Limit to last 100 archives as fallback
    try {
      const day = await loadArchive(date);
      if (state.ticker.startsWith('_')) {
        const key = state.ticker === '_MARKET' ? 'dji' : state.ticker.slice(1).toLowerCase();
        const mi = day?.market_indices || {};
        const p = mi[key];
        if (!p?.price) continue;
        const c = Number(p.price);
        const pct = Number(p.pct_change || 0);
        const o = c / (1 + pct / 100);
        candles.push({ date, open: o, high: Math.max(o,c)*1.005, low: Math.min(o,c)*0.995, close: c, volume: 0 });
      } else {
        const s = findStock(day, state.ticker);
        if (!s?.price) continue;
        const c = Number(s.price);
        const pct = Number(s.pct_change || 0);
        const o = c / (1 + pct / 100);
        candles.push({ date, open: o, high: Math.max(o,c)*1.005, low: Math.min(o,c)*0.995, close: c, volume: s.volume || 0 });
      }
    } catch(e) {}
  }
  return candles.sort((a,b) => a.date.localeCompare(b.date));
}

async function loadCandles() {
  setLoading('กำลังโหลดกราฟ 1D...');
  try {
    const all = await loadHistoryCandles();
    state.candles = filterCandlesByRange(all, state.range);
    setLoading('');
  } catch (e) {
    console.warn(e);
    setLoading('ไม่พบข้อมูลกราฟ');
  }
}

function groupNotesByDate(notes) {
  const groups = new Map();
  notes.forEach(note => {
    const d = noteDate(note);
    if (!d) return;
    if (!groups.has(d)) groups.set(d, []);
    groups.get(d).push(note);
  });
  return [...groups.entries()].map(([date, notes]) => ({ date, notes }));
}

function nearestCandle(date) {
  if (!state.candles.length) return null;
  let best = null, bestDist = Infinity;
  const target = new Date(date + 'T12:00:00').getTime();
  for (let i = 0; i < state.candles.length; i++) {
    const t = new Date(state.candles[i].date + 'T12:00:00').getTime();
    const dist = Math.abs(t - target);
    if (dist < bestDist) { best = { candle: state.candles[i], index: i }; bestDist = dist; }
  }
  return best;
}

function drawChart() {
  const box = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.floor(box.width * dpr));
  canvas.height = Math.max(1, Math.floor(box.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const w = box.width, h = box.height;
  const pad = { left: 56, right: 16, top: 22, bottom: 34 };
  ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, w, h);

  if (!state.candles.length) return;

  const plotW = w - pad.left - pad.right, plotH = h - pad.top - pad.bottom;
  const yMax = Math.max(...state.candles.map(c => c.high)) * 1.05;
  const yMin = Math.min(...state.candles.map(c => c.low)) * 0.95;
  
  const xFor = i => pad.left + (state.candles.length === 1 ? plotW / 2 : (i / (state.candles.length - 1)) * plotW);
  const yFor = p => pad.top + ((yMax - p) / (yMax - yMin)) * plotH;

  // Grid
  ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 1; ctx.textAlign = 'right'; ctx.fillStyle = '#6b7280';
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (plotH * i / 4);
    const p = yMax - ((yMax - yMin) * i / 4);
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
    ctx.fillText(p.toFixed(2), pad.left - 8, y + 4);
  }

  // Candles & Markers
  state.markers = [];
  const cw = Math.max(2, Math.min(10, plotW / state.candles.length * 0.7));
  
  // Find note groups first
  const notesMap = {};
  groupNotesByDate(state.notes).forEach(group => {
    const match = nearestCandle(group.date);
    if (match) {
      notesMap[match.index] = { group, candle: match.candle };
    }
  });

  state.candles.forEach((c, i) => {
    const x = xFor(i), up = c.close >= c.open;
    const isNote = notesMap[i] !== undefined;
    
    if (isNote) {
      const { group } = notesMap[i];
      const active = state.selectedKey === group.date;
      const intensity = state.hoverIntensities[group.date] || 0;
      
      const wFactor = Math.max(active ? 1.0 : 0.0, intensity);
      const finalCw = cw + wFactor * 4;
      
      // Determine emotion color
      const journalNote = group.notes.find(n => n.journal);
      const emotion = journalNote?.journal?.emotion;
      const emotionColor = getEmotionColor(emotion);
      
      // Base colors for up/down 3D cylinder
      const baseCol = up ? '#26a69a' : '#ef5350';
      const lightCol = up ? '#4db6ac' : '#e57373';
      const darkCol = up ? '#00796b' : '#c62828';
      
      // 1. Draw High/Low Wick
      ctx.save();
      ctx.strokeStyle = baseCol;
      ctx.lineWidth = wFactor > 0 ? 1.5 : 1;
      ctx.beginPath();
      ctx.moveTo(x, yFor(c.high));
      ctx.lineTo(x, yFor(c.low));
      ctx.stroke();
      ctx.restore();
      
      // 2. Fill 3D Candle Body
      const bodyY = Math.min(yFor(c.open), yFor(c.close));
      const bodyH = Math.max(1, Math.abs(yFor(c.open) - yFor(c.close)));
      
      let grad = ctx.createLinearGradient(x - finalCw/2, 0, x + finalCw/2, 0);
      grad.addColorStop(0, darkCol);
      grad.addColorStop(0.3, lightCol);
      grad.addColorStop(0.7, baseCol);
      grad.addColorStop(1, darkCol);
      
      ctx.save();
      ctx.fillStyle = grad;
      ctx.fillRect(x - finalCw/2, bodyY, finalCw, bodyH);
      ctx.restore();
      
      // 3. Draw Neon Glowing Border
      ctx.save();
      ctx.strokeStyle = emotionColor;
      ctx.lineWidth = active ? 2.5 : 1.5;
      ctx.shadowColor = emotionColor;
      ctx.shadowBlur = (active ? 15 : 6) + intensity * 10;
      ctx.strokeRect(x - finalCw/2, bodyY, finalCw, bodyH);
      ctx.restore();
      
      // Push marker info for clicking & hovering
      state.markers.push({
        x,
        y: yFor(c.close),
        r: Math.max(12, finalCw + 4),
        key: group.date,
        group,
        candle: c
      });
      
    } else {
      // Normal flat candle
      const col = up ? '#26a69a' : '#ef5350';
      ctx.strokeStyle = col;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(x, yFor(c.high));
      ctx.lineTo(x, yFor(c.low));
      ctx.stroke();
      ctx.fillRect(x - cw/2, Math.min(yFor(c.open), yFor(c.close)), cw, Math.max(1, Math.abs(yFor(c.open) - yFor(c.close))));
    }
  });

  document.getElementById('visibleCount').textContent = `${state.markers.length} จุดบนกราฟช่วงนี้`;
}

      const canvasRect = canvas.getBoundingClientRect();
      const rect = {
        left: canvasRect.left + m.x - 8,
        right: canvasRect.left + m.x + 8,
        top: canvasRect.top + m.y - 8,
        bottom: canvasRect.top + m.y + 8,
        width: 16,
        height: 16
      };
      
      let ttLeft = rect.left + rect.width / 2 - tooltip.offsetWidth / 2;
      const margin = 10;
      const headerRect = document.querySelector('.topbar')?.getBoundingClientRect();
      const topMargin = Math.max(margin, (headerRect?.bottom || 0) + 10);
      let tailLeft = tooltip.offsetWidth / 2;
      
      // Horizontal bounds
      if (ttLeft < margin) {
        ttLeft = margin;
        tailLeft = rect.left + rect.width / 2 - ttLeft;
      } else if (ttLeft + tooltip.offsetWidth > window.innerWidth - margin) {
        ttLeft = window.innerWidth - tooltip.offsetWidth - margin;
        tailLeft = rect.left + rect.width / 2 - ttLeft;
      }
      tailLeft = Math.max(12, Math.min(tooltip.offsetWidth - 12, tailLeft));

      // Vertical bounds and maxHeight
      let isBelow = false;
      let spaceAbove = rect.top - topMargin - 14;
      let spaceBelow = window.innerHeight - rect.bottom - margin - 14;
      
      let ttTop = rect.top - tooltip.offsetHeight - 14;
      
      if (ttTop < topMargin) {
        if (spaceBelow > spaceAbove) {
          isBelow = true;
          ttTop = rect.bottom + 14;
          tooltip.style.maxHeight = `${spaceBelow}px`;
        } else {
          ttTop = topMargin;
          tooltip.style.maxHeight = `${spaceAbove}px`;
        }
      } else {
        tooltip.style.maxHeight = `${Math.min(spaceAbove, window.innerHeight * 0.8)}px`;
      }
      
      if (!isBelow) {
        ttTop = rect.top - tooltip.offsetHeight - 14;
        if (ttTop < topMargin) ttTop = topMargin;
      }

      tooltip.style.left = `${ttLeft}px`;
      tooltip.style.top = `${ttTop}px`;
      tooltip.style.setProperty('--tail-left', `${tailLeft}px`);

      if (isBelow) {
        tooltip.classList.add('tail-top');
      } else {
        tooltip.classList.remove('tail-top');
      }

      // Draw connector line and enable dragging
      updateTooltipConnector();
      initTooltipDragging();
    };
    
    setTimeout(positionTooltip, 0);
  } else if (tooltip) {
    tooltip.classList.remove('show');
  }
}

let connectorFrameId = null;
function queueConnectorUpdate() {
  if (connectorFrameId) return;
  connectorFrameId = requestAnimationFrame(() => {
    connectorFrameId = null;
    updateTooltipConnector();
  });
}

function getBoxIntersection(cx, cy, rect) {
  const mx = rect.left + rect.width / 2;
  const my = rect.top + rect.height / 2;
  const dx = cx - mx;
  const dy = cy - my;
  if (dx === 0 && dy === 0) {
    return { x: mx, y: my };
  }
  const w2 = rect.width / 2;
  const h2 = rect.height / 2;
  const tX = dx !== 0 ? (Math.sign(dx) * w2) / dx : Infinity;
  const tY = dy !== 0 ? (Math.sign(dy) * h2) / dy : Infinity;
  const t = Math.min(Math.abs(tX), Math.abs(tY));
  return { x: mx + t * dx, y: my + t * dy };
}

function updateTooltipConnector() {
  const tooltip = document.getElementById('markerTooltip');
  const svg = document.getElementById('tooltipConnector');
  const line = document.getElementById('connectorLine');
  const dot = document.getElementById('connectorDot');
  if (!tooltip || !svg || !line || !dot) return;

  if (!tooltip.classList.contains('show')) {
    return;
  }

  const canvas = tooltip._sourceCanvas;
  const mKey = tooltip._activeMarker ? tooltip._activeMarker.key : null;
  const m = mKey ? state.markers.find(x => x.key === mKey) : null;
  if (!canvas || !m || canvas.offsetWidth === 0 || canvas.offsetHeight === 0) {
    return;
  }

  const canvasRect = canvas.getBoundingClientRect();
  const candleScreenX = canvasRect.left + m.x;
  const candleScreenY = canvasRect.top + m.y;

  // Calculate sliding edge intersection on the tooltip rectangle to the candle coordinate
  // Use cached dragging rect if active to avoid layout thrashing (getBoundingClientRect)
  let ttRect;
  if (tooltipDragState && tooltipDragState.active) {
    const left = parseFloat(tooltip.style.left) || 0;
    const top = parseFloat(tooltip.style.top) || 0;
    ttRect = {
      left: left,
      top: top,
      right: left + tooltipDragState.width,
      bottom: top + tooltipDragState.height,
      width: tooltipDragState.width,
      height: tooltipDragState.height
    };
  } else {
    const r = tooltip.getBoundingClientRect();
    ttRect = {
      left: r.left,
      top: r.top,
      right: r.right,
      bottom: r.bottom,
      width: r.width,
      height: r.height
    };
  }

  const intersect = getBoxIntersection(candleScreenX, candleScreenY, ttRect);
  const xClamped = intersect.x;
  const yClamped = intersect.y;

  line.setAttribute('x1', candleScreenX);
  line.setAttribute('y1', candleScreenY);
  line.setAttribute('x2', xClamped);
  line.setAttribute('y2', yClamped);

  dot.setAttribute('cx', candleScreenX);
  dot.setAttribute('cy', candleScreenY);
}

let tooltipDragState = { active: false, startX: 0, startY: 0, initialLeft: 0, initialTop: 0, width: 0, height: 0 };

function initTooltipDragging() {
  const tooltip = document.getElementById('markerTooltip');
  if (!tooltip) return;

  if (tooltip._dragBound) return;
  tooltip._dragBound = true;

  tooltip.addEventListener('mousedown', onDragStart);
  tooltip.addEventListener('touchstart', onDragStart, { passive: false });

  function onDragStart(e) {
    const header = e.target.closest('.tt-header');
    if (!header) return;

    e.preventDefault();

    const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;

    tooltipDragState = {
      active: true,
      startX: clientX,
      startY: clientY,
      initialLeft: parseFloat(tooltip.style.left) || 0,
      initialTop: parseFloat(tooltip.style.top) || 0,
      width: tooltip.offsetWidth,
      height: tooltip.offsetHeight
    };

    tooltip.classList.add('dragging');

    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('mouseup', onDragEnd);
    document.addEventListener('touchend', onDragEnd);
  }

  function onDragMove(e) {
    if (!tooltipDragState.active) return;
    if (e.type.startsWith('touch')) e.preventDefault();

    const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;

    const dx = clientX - tooltipDragState.startX;
    const dy = clientY - tooltipDragState.startY;

    let newLeft = tooltipDragState.initialLeft + dx;
    let newTop = tooltipDragState.initialTop + dy;

    const margin = 10;
    newLeft = Math.max(margin, Math.min(window.innerWidth - tooltipDragState.width - margin, newLeft));
    newTop = Math.max(margin, Math.min(window.innerHeight - tooltipDragState.height - margin, newTop));

    tooltip.style.left = `${newLeft}px`;
    tooltip.style.top = `${newTop}px`;

    queueConnectorUpdate();
  }

  function onDragEnd() {
    if (!tooltipDragState.active) return;
    tooltipDragState.active = false;
    tooltip.classList.remove('dragging');

    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('touchmove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);
    document.removeEventListener('touchend', onDragEnd);
  }
}

// Setup MutationObserver to automatically keep SVG connector in sync with tooltip visibility & styles
const tooltipObserver = new MutationObserver((mutations) => {
  mutations.forEach((mutation) => {
    if (mutation.type === 'attributes') {
      queueConnectorUpdate();
    }
  });
});
const markerTooltipEl = document.getElementById('markerTooltip');
if (markerTooltipEl) {
  tooltipObserver.observe(markerTooltipEl, { attributes: true, attributeFilter: ['class', 'style'] });
}

// Recalculate connector line dynamically on scroll & resize to stay pinned to the scrolling/resizing chart
document.addEventListener('scroll', queueConnectorUpdate, { passive: true, capture: true });
window.addEventListener('resize', queueConnectorUpdate, { passive: true });

function renderNoteList() {
  const list = document.getElementById('noteList');
  const groups = groupNotesByDate(state.notes).sort((a,b) => b.date.localeCompare(a.date));
  document.getElementById('noteSummary').textContent = `${state.notes.length} มุมมอง · ${groups.length} วัน`;
  list.innerHTML = groups.map(g => `
    <button class="note-card" onclick="selectDate('${g.date}')" data-key="${g.date}">
      <div class="note-card-date">${fmtDate(g.date)}</div>
      <div class="note-card-text">${esc(g.notes[0]?.note)}</div>
    </button>
  `).join('');
}

window.selectDate = (d) => {
  const g = groupNotesByDate(state.notes).find(x => x.date === d);
  if (g) showGroup(g, nearestCandle(d)?.candle);
};

function updateHeader() {
  const s = state.latestStock;
  const isMarket = state.ticker.startsWith('_');
  
  let title = state.ticker;
  let subtitle = s ? `${s.name} · ${s.sector}` : 'History Always Latest';
  let badgeHtml = `<span class="badge">${state.notes.length} notes</span>`;
  
  if (isMarket) {
    const labelMap = { '_MARKET': 'ภาพรวมตลาด', '_DJI': 'Dow Jones', '_SPX': 'S&P 500', '_IXIC': 'NASDAQ' };
    title = labelMap[state.ticker] || state.ticker;
    subtitle = 'Daily chart · market note history';
    
    // Add specific index price details to badge
    const key = state.ticker === '_MARKET' ? 'dji' : state.ticker.slice(1).toLowerCase();
    const nameMap = { dji: 'DJI', spx: 'S&P 500', ixic: 'NASDAQ' };
    const market = state.latestMarket || {};
    const p = market[key];
    if (p?.price) {
      badgeHtml += `<span class="badge">${nameMap[key]} ${fmtMoney(p.price)}${p.pct_change != null ? ` · ${p.pct_change >= 0 ? '+' : ''}${Number(p.pct_change).toFixed(2)}%` : ''}</span>`;
    }
  }
  
  document.getElementById('tickerTitle').textContent = title;
  document.getElementById('tickerSub').textContent = subtitle;
  document.getElementById('badgeRow').innerHTML = badgeHtml;
}

function bindEvents() {
  document.addEventListener('click', e => {
    if (!e.target.closest('#priceCanvas') && !e.target.closest('.note-list') && !e.target.closest('.marker-tooltip')) {
      const tooltip = document.getElementById('markerTooltip');
      if (tooltip) tooltip.classList.remove('show');
    }
  });

  document.getElementById('rangeTabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) setRange(b.dataset.range);
  });

  canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    const m = state.markers.find(m => Math.hypot(m.x-x, m.y-y) <= m.r);
    
    if (!m) {
      const tooltip = document.getElementById('markerTooltip');
      if (tooltip) tooltip.classList.remove('show');
    }

    if (m) showGroup(m.group, m.candle);
  });

  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    const m = state.markers.find(m => Math.hypot(m.x-x, m.y-y) <= m.r);
    
    if (m) {
      if (state.hoveredKey !== m.key) {
        state.hoveredKey = m.key;
        canvas.style.cursor = 'pointer';
        startAnimation();
      }
    } else {
      if (state.hoveredKey !== null) {
        state.hoveredKey = null;
        canvas.style.cursor = 'default';
        startAnimation();
      }
    }
  });

  canvas.addEventListener('mouseleave', () => {
    if (state.hoveredKey !== null) {
      state.hoveredKey = null;
      canvas.style.cursor = 'default';
      startAnimation();
    }
  });

  window.addEventListener('resize', () => { clearTimeout(state.resizeTimer); state.resizeTimer = setTimeout(drawChart, 150); });
}

async function setRange(r) {
  state.range = r;
  document.querySelectorAll('#rangeTabs button').forEach(b => b.classList.toggle('active', b.dataset.range === r));
  await loadCandles(); drawChart();
}

function startAnimation() {
  if (state.animating) return;
  state.animating = true;
  requestAnimationFrame(animationLoop);
}

function animationLoop() {
  let changed = false;
  for (const m of state.markers) {
    const key = m.key;
    const current = state.hoverIntensities[key] || 0;
    const target = (state.hoveredKey === key) ? 1.0 : 0.0;
    const diff = target - current;
    
    if (Math.abs(diff) > 0.01) {
      state.hoverIntensities[key] = current + diff * 0.18;
      changed = true;
    } else {
      state.hoverIntensities[key] = target;
    }
  }
  
  if (changed) {
    drawChart();
    requestAnimationFrame(animationLoop);
  } else {
    state.animating = false;
  }
}

async function init() {
  bindBackLinkRestore();
  bindEvents();
  await Promise.all([loadNotes(), loadLatestStock()]);
  updateHeader();
  renderNoteList();
  await loadCandles();
  drawChart();
  const last = groupNotesByDate(state.notes).pop();
  if (last) selectDate(last.date);
}

init();
  </script>
<div id="markerTooltip" class="marker-tooltip"></div>

<!-- Tooltip Connector Line SVG -->
<svg id="tooltipConnector" width="100%" height="100%">
  <defs>
    <filter id="connectorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <line id="connectorLine" x1="0" y1="0" x2="0" y2="0" stroke="rgba(240, 185, 11, 0.85)" stroke-width="1.8" filter="url(#connectorGlow)" />
  <circle id="connectorDot" cx="0" cy="0" r="4.5" fill="#f0b90b" filter="url(#connectorGlow)" />
</svg>
