name: Beer Top 100 Market Cap (US)

on:
  schedule:
    - cron: '17 11 * * 1-5'      # 18:17 Bangkok, Mon-Fri
    - cron: '17 23 * * 1-5'      # 06:17 Bangkok, Tue-Sat
  workflow_dispatch:
    inputs:
      phase:
        description: Report phase to run
        required: false
        default: manual
        type: choice
        options:
          - manual
          - premarket
          - postmarket
      report_date:
        description: Optional report date in YYYY-MM-DD format
        required: false
        type: string
      recovery_reason:
        description: Optional recovery reason from watchdog
        required: false
        type: string

permissions:
  contents: write

env:
  TZ: Asia/Bangkok
  GROQ_CALL_DELAY: "35"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-paraphrase-multilingual-minilm

      - name: Install PyTorch (CPU only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select report phase
        run: |
          requested_phase="${{ github.event.inputs.phase }}"
          requested_date="${{ github.event.inputs.report_date }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$requested_phase" ] && [ "$requested_phase" != "manual" ]; then
            phase="$requested_phase"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "17 11 * * 1-5" ]; then
            phase="premarket"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "17 23 * * 1-5" ]; then
            phase="postmarket"
          else
            phase="manual"
          fi
          echo "RUN_PHASE=$phase" >> "$GITHUB_ENV"
          if [ -n "$requested_date" ]; then
            echo "REPORT_DATE=$requested_date" >> "$GITHUB_ENV"
            echo "Selected REPORT_DATE=$requested_date"
          fi
          echo "Selected RUN_PHASE=$phase"

      - name: Run Beer Top 100 Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_REQUEST_SOURCE: ${{ github.event.inputs.recovery_reason }}
        run: |
          cmd=(python beer_top100_agent.py --workers 2)
          if [ -n "${REPORT_DATE:-}" ]; then
            cmd+=(--date "$REPORT_DATE")
          fi
          "${cmd[@]}"

      - name: Commit web archive data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add docs/data/ docs/history-data/ stock_metadata_cache.json
          if git diff --cached --quiet; then
            echo "No archive changes to commit"
            exit 0
          fi
          git commit -m "Top 100 ${RUN_PHASE:-report} report $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push failed; rebasing latest main before retry ${attempt}"
            git pull --rebase --autostash origin main
            sleep $((attempt * 10))
          done
          exit 1
