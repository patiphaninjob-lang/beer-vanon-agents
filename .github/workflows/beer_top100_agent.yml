name: Beer Top 100 Market Cap (US)

on:
  schedule:
    - cron: '0 11 * * 1-5'       # 18:00 Bangkok, Mon-Fri
    - cron: '0 23 * * 1-5'       # 06:00 Bangkok, Tue-Sat
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Bangkok
  GROQ_CALL_DELAY: "35"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-paraphrase-multilingual-minilm

      - name: Install PyTorch (CPU only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select report phase
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 11 * * 1-5" ]; then
            phase="premarket"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 23 * * 1-5" ]; then
            phase="postmarket"
          else
            phase="manual"
          fi
          echo "RUN_PHASE=$phase" >> "$GITHUB_ENV"
          echo "Selected RUN_PHASE=$phase"

      - name: Run Beer Top 100 Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python beer_top100_agent.py --workers 2

      - name: Commit web archive data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add docs/data/ docs/history-data/ stock_metadata_cache.json
          if git diff --cached --quiet; then
            echo "No archive changes to commit"
            exit 0
          fi
          git commit -m "Top 100 ${RUN_PHASE:-report} report $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push failed; rebasing latest main before retry ${attempt}"
            git pull --rebase --autostash origin main
            sleep $((attempt * 10))
          done
          exit 1
